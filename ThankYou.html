<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enquiry submitted | Seven Hills Wai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap">
<style>
  :root {
    --bg: #f9f8f3;
    --ink: #1a1a18;
    --olive: #5f7129;
    --muted: #6b6b63;
    --line: #dcdacd;
    --wa: #25d366;
    --wa-dark: #1ebe5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .sh-ty {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(32px + env(safe-area-inset-top, 0px)) 24px calc(140px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    background:
      var(--bg);
  }

  /* hills silhouette */
  .sh-ty__hills {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: clamp(110px, 22vh, 200px);
    pointer-events: none;
  }

  .sh-ty__card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  /* animated tick */
  .sh-tick {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 36px;
  }
  .sh-tick__ripple {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--olive);
    opacity: 0;
    animation: sh-ripple 1.6s ease-out 1.25s 2;
  }
  .sh-tick__ripple.r2 { animation-delay: 1.55s; }
  .sh-tick svg { position: relative; width: 100%; height: 100%; overflow: visible; }
  .sh-tick__disc {
    fill: rgba(95,113,41,.10);
    transform-origin: 50% 50%;
    transform: scale(.6);
    opacity: 0;
    animation: sh-pop .5s cubic-bezier(.2,.9,.3,1.3) .75s forwards;
  }
  .sh-tick__ring {
    fill: none;
    stroke: var(--olive);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    animation: sh-draw .8s cubic-bezier(.65,0,.35,1) .15s forwards;
  }
  .sh-tick__check {
    fill: none;
    stroke: var(--olive);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: sh-draw .45s cubic-bezier(.65,0,.35,1) .85s forwards;
  }

  @keyframes sh-draw { to { stroke-dashoffset: 0; } }
  @keyframes sh-pop { to { transform: scale(1); opacity: 1; } }
  @keyframes sh-ripple {
    0%   { transform: scale(1);   opacity: .55; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* text */
  .sh-badge {
    display: inline-block;
    margin-bottom: 22px;
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    opacity: 0;
    animation: sh-rise .6s ease 1.0s forwards;
  }
  .sh-ty__title {
    font-weight: 300;
    font-size: clamp(54px, 13vw, 92px);
    line-height: .95;
    letter-spacing: -.045em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(8px);
    animation: sh-rise .6s ease 1.1s forwards;
  }
  .sh-ty__accent { color: var(--olive); }
  .sh-ty__text {
    margin: 16px auto 0;
    max-width: 42ch;
    font-size: clamp(16px, 2.4vw, 18px);
    line-height: 1.6;
    color: var(--muted);
    opacity: 0;
    transform: translateY(8px);
    animation: sh-rise .6s ease 1.25s forwards;
  }
  .sh-ty__actions {
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: translateY(8px);
    animation: sh-rise .6s ease 1.4s forwards;
  }
  @keyframes sh-rise { to { opacity: 1; transform: none; } }

  .sh-wa {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 54px;
    padding: 0 30px;
    border-radius: 999px;
    background: var(--wa);
    color: #fff;
    font: 700 17px/1 "DM Sans", system-ui, sans-serif;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(37,211,102,.28);
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .sh-wa svg { width: 24px; height: 24px; flex: none; }
  .sh-wa:hover { background: var(--wa-dark); transform: translateY(-2px); box-shadow: 0 14px 32px rgba(37,211,102,.36); }
  .sh-wa:active { transform: translateY(0); }
  .sh-wa:focus-visible,
  .sh-home:focus-visible { outline: 3px solid var(--olive); outline-offset: 3px; }

  .sh-home {
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--line);
    padding: 6px 4px;
  }
  .sh-home:hover { color: var(--ink); text-decoration-color: var(--olive); }

  @media (max-width: 480px) {
    .sh-wa { width: 100%; }
    .sh-tick { width: 112px; height: 112px; margin-bottom: 30px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sh-tick__ring, .sh-tick__check { animation: none; stroke-dashoffset: 0; }
    .sh-tick__disc { animation: none; transform: none; opacity: 1; }
    .sh-tick__ripple { display: none; }
    .sh-badge, .sh-ty__title, .sh-ty__text, .sh-ty__actions { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<main class="sh-ty">

  <svg class="sh-ty__hills" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 200V120c120-50 220-70 330-40 110 30 190 70 320 40 130-30 210-95 340-85 130 10 210 55 450 25v140z" fill="#eceedd"/>
    <path d="M0 200v-48c140-30 260-20 380 6 120 26 240 34 380-4 140-38 260-50 380-26 100 20 180 30 300 8v64z" fill="#dfe4c9"/>
  </svg>

  <section class="sh-ty__card" aria-labelledby="sh-ty-title">

    <div class="sh-tick" role="img" aria-label="Success">
      <span class="sh-tick__ripple"></span>
      <span class="sh-tick__ripple r2"></span>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="sh-tick__disc" cx="60" cy="60" r="50"/>
        <circle class="sh-tick__ring" cx="60" cy="60" r="50"/>
        <path class="sh-tick__check" d="M38 62l15 15 30-33"/>
      </svg>
    </div>

    <span class="sh-badge">Seven Hills Wai</span>
    <h1 class="sh-ty__title" id="sh-ty-title">Enquiry<br><span class="sh-ty__accent">submitted</span></h1>
    <p class="sh-ty__text">
      Thank you for your interest in Seven Hills Wai. Our team will call you shortly
      to discuss plots, pricing and site visits.
    </p>

    <div class="sh-ty__actions">
      <a class="sh-wa" id="sh-wa-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.29z"/>
        </svg>
        Chat on WhatsApp
      </a>
      <a class="sh-home" href="/">Back to website</a>
    </div>

  </section>
</main>

<script>
  (function () {
    // ---- EDIT THESE TWO LINES ----
    var WHATSAPP_NUMBER = "919999999999"; // country code + number, digits only (no + or spaces)
    var WHATSAPP_MESSAGE = "Hi, I just submitted an enquiry for Seven Hills Wai. Please share more details.";
    // ------------------------------

    var btn = document.getElementById("sh-wa-btn");
    if (btn) {
      btn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(WHATSAPP_MESSAGE);
    }
  })();


  
</script>

</body>
</html>
